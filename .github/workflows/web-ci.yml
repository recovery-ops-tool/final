name: web-ci

on:
  push:
    branches: [main, master]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

defaults:
  run:
    working-directory: web

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # 610 pre-existing lint errors as of 2026-08-04 (mostly React-Compiler-era rules:
      # react-hooks/set-state-in-effect, react-hooks/purity, react-hooks/refs; plus
      # no-explicit-any, no-unused-vars) -- this has likely been silently red since the
      # workflow was added. Non-blocking until that debt is paid down deliberately, so
      # typecheck/build still gate merges instead of every push showing a failed check.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      # SYSTEM 06 TASK 6.3.a: 1 pre-existing HIGH finding as of 2026-08-18 -- xlsx (SheetJS)
      # has an unpatched prototype-pollution/ReDoS advisory with no fix available. Checked:
      # this app only ever calls XLSX.write/aoa_to_sheet on its own generated data
      # (web/src/utils/visitExport.ts) -- it never parses untrusted input (XLSX.read is not
      # called anywhere), so the exploitable path (parsing a malicious spreadsheet) isn't
      # reachable here. The server-side untrusted-upload path uses Apache POI (Java), an
      # entirely separate library. Non-blocking until xlsx is replaced or the advisory is
      # patched upstream -- revisit if either changes, or if this file ever grows a read/parse
      # path.
      - run: npm audit --audit-level=high
        continue-on-error: true
