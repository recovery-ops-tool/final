name: secret-scan

# SYSTEM 06 TASK 6.3.b: catches a committed credential (API key, DB password, JWT secret, etc.)
# before it reaches a remote review, not path-filtered -- a secret can land in any file anywhere
# in the repo, not just server/web/mobile source. Runs gitleaks' own default ruleset (AWS keys,
# generic high-entropy tokens, common provider key formats, etc.), which is the specific pattern
# family this task's acceptance check (a fake AWS key) exercises.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the working tree -- a secret that was added
          # and then removed in a later commit is still exposed to anyone who clones the repo.
          # Depth 0 = full history, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
