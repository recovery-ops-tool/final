server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;

    # Security headers. HSTS assumes TLS is terminated in front of this
    # container (a cloud LB/ingress) — it tells the browser to always use
    # HTTPS for this origin going forward, which holds regardless of whether
    # this specific hop is plaintext behind the LB. The CSP here mirrors
    # index.html's meta-tag CSP but is the one that actually matters for
    # frame-ancestors: per spec, that directive is a no-op when delivered
    # via meta tag and only takes effect via a real HTTP header.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.amazonaws.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # SYSTEM 07 TASK 7.1: geolocation is used throughout field-visit tracking
    # (StartVisitPage, VisitInterviewPage, VisitSubmitPage, ShiftSosCard,
    # useFoLocationPublisher) and microphone by Lucien's voice features and SOS
    # audio recording (utils/speech.ts, ShiftSosCard) -- both allowed for this
    # origin only. Camera is denied: photo capture (selfie/site/proof photos in
    # VisitSubmitHelpers) uses a plain <input type="file" capture="..."> element,
    # which goes through the OS camera app directly and does not need the
    # getUserMedia-gated camera permission at all.
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;

    # Health check for container orchestration probes.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build assets (Vite fingerprints filenames) — safe to cache
    # forever since a content change always produces a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Serve React app. index.html itself must always revalidate — it's the
    # one file whose content can change without its URL changing.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Spring Boot backend
    location /api/ {
        # must be >= spring.servlet.multipart.max-request-size (55MB) — nginx
        # defaults to 1MB, which was silently rejecting visit photo uploads
        client_max_body_size 60m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections (e.g., SSE or live-track)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
