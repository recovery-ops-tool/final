# ── Production profile overrides ─────────────────────────────────────────────
# Activated via SPRING_PROFILES_ACTIVE=prod. Everything not overridden here
# inherits from application.properties, which already sources every secret
# and most environment-specific config from env vars (12-factor style) --
# see docs/CONFIG-REFERENCE.md for the full checklist of vars a production
# deploy must set (DB/Redis/JWT/S3/Stripe/mail/CORS/trusted-proxy/etc), and
# server/.env.example for a fill-in-the-blanks template. A deliberately
# missing DB_PASSWORD/JWT_SECRET/PII encryption key/TRUSTED_PROXY_CIDR is
# refused at boot by ProductionConfigEnvironmentPostProcessor (SYSTEM 04).

# Don't expose interactive API docs publicly in production (SecurityConfig
# whitelists /swagger-ui/** and /v3/api-docs/** for local/dev convenience).
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# SYSTEM 03 TASK 3.2: migrations run as an explicit pre-deploy step in production
# (docs/RUNBOOK-DEPLOY.md), not implicitly at app boot -- auto-migrate-on-boot means a bad
# migration takes every instance down simultaneously, at the worst possible moment to discover it.
# FLYWAY_ENABLED can still force this on for a one-off if genuinely needed.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
