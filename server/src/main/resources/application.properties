# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=ops-tool-server
server.port=8080
server.servlet.context-path=/
# Only the address ranges matching this regex have their X-Forwarded-For header trusted
# (i.e. treated as our own load balancer/reverse proxy); everyone else's client IP is
# taken from the raw socket address. Empty by default (nothing trusted) - set to the
# LB/ingress network CIDR regex in production via TRUSTED_PROXY_CIDR.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDR:}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recoverpro}
spring.datasource.username=${DB_USER:opstool}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Internal recipient for the public contact-us form. Left blank on purpose - if unset,
# EmailServiceImpl logs a warning and skips sending rather than guessing an address.
app.mail.contact-recipient=${CONTACT_EMAIL_RECIPIENT:}

# ── PII field-level encryption ────────────────────────────────────────────────
app.encryption.enabled=${PII_ENCRYPTION_ENABLED:true}
app.encryption.provider=${PII_ENCRYPTION_PROVIDER:local}
app.encryption.key-base64=${PII_ENCRYPTION_KEY_BASE64:}
app.encryption.kms.region=${PII_ENCRYPTION_KMS_REGION:}
app.encryption.kms.key-id=${PII_ENCRYPTION_KMS_KEY_ID:}

# ── Security / JWT ────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:s1lU3vHhDTk4o2QpF2CLL8UeT6nWAcZ9G2MxVYbZ3Ms=}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── AWS S3 ────────────────────────────────────────────────────────────────────
# aws.s3.enabled gates S3Config's S3Client/S3Presigner beans (@ConditionalOnProperty) and
# S3OrLocalStoragePort's storage target -- when false (the default), uploads go to local
# disk instead, which does not survive a container restart or scale past one instance.
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${S3_BUCKET:ops-tool-documents}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ── Stripe ────────────────────────────────────────────────────────────────────
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.trial-days=${STRIPE_TRIAL_DAYS:14}
app.stripe.price.starter=${STRIPE_PRICE_STARTER:}
app.stripe.price.growth=${STRIPE_PRICE_GROWTH:}
app.stripe.price.enterprise=${STRIPE_PRICE_ENTERPRISE:}
app.base-url=${APP_BASE_URL:http://localhost:3000}

# ── Schedulers ────────────────────────────────────────────────────────────────
app.scheduler.mis-eod-cron=${MIS_EOD_CRON:0 0 20 * * *}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
application.file.allowed-types=${FILE_ALLOWED_TYPES:text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
application.file.max-size-bytes=${FILE_MAX_SIZE_BYTES:20971520}

# ── Lucien AI ─────────────────────────────────────────────────────────────────
lucien.llama.base-url=${LLAMA_BASE_URL:http://localhost:11434}
lucien.llama.model=${LLAMA_MODEL:llama3}
lucien.llama.embedding-model=${LLAMA_EMBEDDING_MODEL:nomic-embed-text}
lucien.llama.max-tokens=${LLAMA_MAX_TOKENS:1024}
lucien.llama.temperature=${LLAMA_TEMPERATURE:0.7}
lucien.llama.top-p=${LLAMA_TOP_P:0.9}
lucien.llama.connect-timeout-ms=${LLAMA_CONNECT_TIMEOUT_MS:5000}
lucien.llama.read-timeout-ms=${LLAMA_READ_TIMEOUT_MS:300000}
lucien.agent.max-iterations=${LUCIEN_AGENT_MAX_ITERATIONS:8}
lucien.rate-limit.max-requests=${LUCIEN_RATE_LIMIT_MAX:20}
lucien.rate-limit.window-seconds=${LUCIEN_RATE_LIMIT_WINDOW:60}

# Local voice microservice (tts-service/ — FastAPI, wraps ai4bharat/IndicF5 for TTS and
# faster-whisper for STT). Shared base URL for both TtsClient and SttClient; same process.
#
# TTS (/tts, IndicF5): measured at ~8-9 minutes per reply in isolation on this CPU-only
# dev machine (no GPU), and prone to exceeding 15+ minutes if a second reply overlaps it —
# not viable for real usage. Not currently called from the frontend (LucienPanel always
# uses the browser voice); left wired here for whenever a fast-enough synthesis path
# (GPU / hosted API) exists.
#
# STT (/stt, faster-whisper): transcribing a short dictation clip is a much lighter job
# than TTS and runs in a few seconds on CPU, so this one IS called from the frontend —
# it's what backs the composer's mic button.
lucien.tts.base-url=${TTS_BASE_URL:http://localhost:8100}
lucien.tts.connect-timeout-ms=${TTS_CONNECT_TIMEOUT_MS:5000}
lucien.tts.read-timeout-ms=${TTS_READ_TIMEOUT_MS:60000}
resilience4j.circuitbreaker.instances.tts.sliding-window-size=10
resilience4j.circuitbreaker.instances.tts.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.tts.slow-call-duration-threshold=55000
resilience4j.circuitbreaker.instances.tts.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.tts.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tts.wait-duration-in-open-state=30000

# Circuit breaker for SttClient (tts-service's /stt endpoint, faster-whisper). Unlike
# IndicF5 TTS, transcribing a short dictation clip on CPU normally takes a few seconds —
# a much tighter slow-call threshold than the tts breaker's is appropriate here.
resilience4j.circuitbreaker.instances.stt.sliding-window-size=10
resilience4j.circuitbreaker.instances.stt.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.stt.slow-call-duration-threshold=15000
resilience4j.circuitbreaker.instances.stt.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.stt.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stt.wait-duration-in-open-state=30000

# Circuit breaker for the "llama" client (LlamaClient.chat/embed). Resilience4j's default
# slow-call-duration-threshold is 60s, but a CPU-only 8B model routinely takes 100-250s per
# reply — with the default, nearly every successful reply was recorded as a "slow call" and
# the breaker tripped open on its own, even though Ollama was healthy. Keep this just under
# lucien.llama.read-timeout-ms so only calls near the real timeout count as slow.
resilience4j.circuitbreaker.instances.llama.sliding-window-size=20
resilience4j.circuitbreaker.instances.llama.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.llama.slow-call-duration-threshold=280000
resilience4j.circuitbreaker.instances.llama.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.llama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llama.wait-duration-in-open-state=30000
clamav.enabled=${CLAMAV_ENABLED:false}
clamav.host=${CLAMAV_HOST:localhost}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.recoverpro=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
