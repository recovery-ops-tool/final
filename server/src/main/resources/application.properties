# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=ops-tool-server
server.port=8080
server.servlet.context-path=/
# Only the address ranges matching this regex have their X-Forwarded-For header trusted
# (i.e. treated as our own load balancer/reverse proxy); everyone else's client IP is
# taken from the raw socket address. Empty by default (nothing trusted) - set via
# TRUSTED_PROXY_CIDR in production. SYSTEM 07 TASK 7.1: despite the env var's name, this is a
# Java regex (Tomcat's RemoteIpValve compiles it with Pattern.compile), NOT CIDR notation -- a
# literal CIDR string like "172.28.0.0/16" would never match any real IP; the equivalent regex
# for that /16 subnet is "172\.28\.\d{1,3}\.\d{1,3}". See docs/CONFIG-REFERENCE.md.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDR:}
# SYSTEM 05 TASK 5.3: on SIGTERM, stop accepting new requests but let in-flight ones (and the
# readiness-state transition to REFUSING_TRAFFIC below) finish first instead of dropping them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Scheduling ────────────────────────────────────────────────────────────────
# SYSTEM 05 TASK 5.3: Spring Boot's default scheduler pool size is 1 -- every one of this app's
# 15 @Scheduled jobs (HikariPoolExhaustionMonitor, PartitionMaintenanceJob, DunningScheduler,
# MaintenanceScheduler, VisitApprovalScheduler, UnassignedCaseScheduler, SettlementOfferScheduler,
# ReconciliationScheduler, ReconciliationEodScheduler, PtpScheduler, MonthlySnapshotScheduler,
# MisEodScheduler, WebSocketHeartbeatManager, LucienSessionTtlJob, PingTtlScheduler) was sharing
# that single thread, so a slow batch job (e.g. MonthlySnapshotScheduler) could starve a
# time-sensitive one (e.g. WebSocketHeartbeatManager) system-wide.
spring.task.scheduling.pool.size=8
# Default (false) does not wait for an in-flight @Scheduled run on shutdown -- a job killed
# mid-execution leaves its ShedLock lock held until ShedLockConfig's defaultLockAtMostFor
# (PT10M) safety-net TTL expires. That bound is fine for a crash; for an ordinary graceful
# SIGTERM there's no reason not to just wait for the job to finish and release its lock cleanly.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/opstool}
spring.datasource.username=${DB_USER:opstool}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# SYSTEM 02 TASK 2.3: these were hardcoded (20/5/30000) while server/.env.example already
# documented DB_POOL_SIZE/DB_MIN_IDLE as configurable -- neither env var actually did anything.
# Wired here so they do; defaults unchanged so behavior is identical wherever they're unset.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
# SYSTEM 03 TASK 3.2: default true (local dev, CI) so nothing changes there; overridden to
# default false under the prod profile (application-prod.properties) -- a production deploy runs
# migrations as an explicit pre-deploy step (docs/RUNBOOK-DEPLOY.md), not implicitly at app boot,
# so a bad migration can't take every instance down simultaneously. FLYWAY_ENABLED still lets
# either environment override the default explicitly if genuinely needed.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Internal recipient for the public contact-us form. Left blank on purpose - if unset,
# EmailServiceImpl logs a warning and skips sending rather than guessing an address.
app.mail.contact-recipient=${CONTACT_EMAIL_RECIPIENT:}

# ── Ops alerts (OpsAlertService) ────────────────────────────────────────────────
# Who gets emailed when a background job (reconciliation, snapshots, PTP sweep, etc.)
# fails. Falls back to app.mail.contact-recipient if unset; logs a warning and skips
# sending if neither is configured -- the same "don't guess an address" convention as
# the contact form above.
app.alerts.ops-recipient=${OPS_ALERT_RECIPIENT:}
# Minimum minutes between two alert emails for the *same* job, so a job stuck in a
# retry loop sends one email, not one per attempt.
app.alerts.cooldown-minutes=${OPS_ALERT_COOLDOWN_MINUTES:30}

# ── Settlement offers ────────────────────────────────────────────────────────
# Discount % above which a settlement offer requires ORG_ADMIN/PLATFORM_ADMIN approval
# instead of TL/MANAGER (see SettlementOfferServiceImpl.draft / design spec).
app.settlement.compliance-review-discount-threshold-pct=${SETTLEMENT_COMPLIANCE_THRESHOLD_PCT:30}

# ── Grievances ───────────────────────────────────────────────────────────────
# This org's own SLA commitment, not a cited RBI figure -- the lucien-corpus flags the actual
# regulatory response-time SLA as unverified (see design spec).
app.grievance.acknowledgement-sla-days=${GRIEVANCE_ACK_SLA_DAYS:3}
app.grievance.resolution-sla-days=${GRIEVANCE_RESOLUTION_SLA_DAYS:30}

# ── PII field-level encryption ────────────────────────────────────────────────
app.encryption.enabled=${PII_ENCRYPTION_ENABLED:true}
app.encryption.provider=${PII_ENCRYPTION_PROVIDER:local}
app.encryption.key-base64=${PII_ENCRYPTION_KEY_BASE64:}
app.encryption.kms.region=${PII_ENCRYPTION_KMS_REGION:}
app.encryption.kms.key-id=${PII_ENCRYPTION_KMS_KEY_ID:}
# Separate key for LookupHashService's HMAC (encrypted-field search). Without this,
# it derives the HMAC key from the main encryption key above -- reusing key material
# across purposes, which LookupHashService itself logs a warning about on every boot.
app.encryption.lookup-hash-key=${PII_LOOKUP_HASH_KEY_BASE64:}
# One-time switch for LookupHashBackfillRunner -- leave false; set true for exactly
# one run after rotating app.encryption.lookup-hash-key, then back to false.
app.backfill.lookup-hash=${LOOKUP_HASH_BACKFILL:false}

# ── Security / JWT ────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── AWS S3 ────────────────────────────────────────────────────────────────────
# aws.s3.enabled gates S3Config's S3Client/S3Presigner beans (@ConditionalOnProperty) and
# S3OrLocalStoragePort's storage target -- when false (the default), uploads go to local
# disk instead, which does not survive a container restart or scale past one instance.
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${S3_BUCKET:ops-tool-documents}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Empty (default) = talk to real AWS S3, unchanged. Set to an S3-compatible endpoint (e.g. OCI
# Object Storage's S3-compatible API URL) to store uploads/reports there instead -- see
# docs/RUNBOOK-DR.md SYSTEM 41 TASK 41.2b: the docker-compose `uploads`/`reports` volumes live
# only on the single app VM's local disk today, with no redundancy and nothing backing them up.
aws.s3.endpoint-override=${AWS_S3_ENDPOINT_OVERRIDE:}

# ── Stripe ────────────────────────────────────────────────────────────────────
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.trial-days=${STRIPE_TRIAL_DAYS:14}
app.stripe.price.starter=${STRIPE_PRICE_STARTER:}
app.stripe.price.growth=${STRIPE_PRICE_GROWTH:}
app.stripe.price.enterprise=${STRIPE_PRICE_ENTERPRISE:}
app.base-url=${APP_BASE_URL:http://localhost:3000}

# ── Razorpay ──────────────────────────────────────────────────────────────────
# Unset by default -- RazorpayPaymentProvider logs a warning and refuses calls
# until these are configured with real credentials (RazorpayConfig#init).
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.trial-days=${RAZORPAY_TRIAL_DAYS:14}
app.razorpay.plan.starter=${RAZORPAY_PLAN_STARTER:}
app.razorpay.plan.growth=${RAZORPAY_PLAN_GROWTH:}
app.razorpay.plan.enterprise=${RAZORPAY_PLAN_ENTERPRISE:}

# ── GST (Indian tax on RecoverPro's own SaaS invoices) ─────────────────────────
# Unset by default -- GstInvoiceLineItemService refuses to run until
# app.gst.supplier-gstin is set to RecoverPro's real, valid GSTIN (GstConfig#init).
# default-rate-bps (1800 = 18%) is a placeholder pending accountant confirmation,
# not an asserted-correct figure -- see GstCalculator's javadoc.
app.gst.supplier-gstin=${GST_SUPPLIER_GSTIN:}
app.gst.default-rate-bps=${GST_DEFAULT_RATE_BPS:1800}

# ── Schedulers ────────────────────────────────────────────────────────────────
app.scheduler.mis-eod-cron=${MIS_EOD_CRON:0 0 20 * * *}

# ── Actuator ──────────────────────────────────────────────────────────────────
# SYSTEM 06 TASK 6.4.c: "info" added so /actuator/info (git SHA + build time, from
# git-commit-id-maven-plugin / spring-boot-maven-plugin's build-info goal, both in
# server/pom.xml) lets a running instance be traced back to the exact commit it was built
# from -- deploy tooling and anyone debugging "what's actually live right now" needs this.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=when-authorized
# SYSTEM 12 TASK 12.1: management.metrics.export.prometheus.enabled (the property this line used
# to set) is deprecated at "error" level in Spring Boot 3.4 -- it no longer binds to anything at
# runtime (confirmed directly against spring-boot-actuator-autoconfigure-3.4.13.jar's
# spring-configuration-metadata.json, which lists it "deprecated": true, "level": "error",
# "replacement": "management.prometheus.metrics.export.enabled"). With only the dead key set,
# /actuator/prometheus never registered as an endpoint at all -- not a 401/403, a genuine
# NoResourceFoundException, confirmed via a real request against a running test instance
# (MetricsExportTest), not just by reading this file. This is the live property name.
management.prometheus.metrics.export.enabled=true
# SYSTEM 05 TASK 5.2: exposes /actuator/health/liveness and /actuator/health/readiness as
# separate sub-paths, backed by Spring Boot's AvailabilityState (livenessState/readinessState)
# rather than the aggregate /actuator/health used above. A load balancer/orchestrator should
# point its liveness check at .../liveness (is the process alive, restart if not) and its
# readiness check at .../readiness (can it serve traffic right now, pull from rotation if not) --
# using the same aggregate endpoint for both means a slow-but-alive dependency (e.g. Redis
# blip) triggers a container restart instead of just a rotation-pull, which doesn't fix anything.
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Default readiness group is just readinessState by itself -- Redis/DB are added explicitly so a
# broken dependency actually pulls the instance out of rotation. `db` goes beyond the task's
# literal "Flyway and Redis" wording, but a database that's down is at least as much a reason to
# stop receiving traffic as Redis is.
#
# Flyway is deliberately NOT in this list, despite the task's original wording -- verified against
# the actual spring-boot-actuator-autoconfigure-3.4.13.jar contents: Spring Boot ships no Flyway
# health *contributor* at all (only FlywayEndpointAutoConfiguration, the /actuator/flyway info
# endpoint). Naming a nonexistent contributor here doesn't just no-op -- Spring Boot's readiness
# group membership validation refuses to let the ApplicationContext start at all, which broke
# every integration test and would have broken production boot outright, found via a real `mvn
# test` run (confirmed by removing the entry and re-running). A hand-rolled Flyway HealthIndicator
# was considered instead, but this app's design (spring.flyway.enabled=false by default in prod --
# migrations are an explicit pre-deploy step, see application-prod.properties and
# docs/RUNBOOK-DEPLOY.md -- plus StartupSchemaVersionCheck already refusing to boot at all if the
# schema is behind what the build expects) means schema-currency is already a boot-time gate, not
# something that can drift during the process's lifetime the way a live Redis/DB connection can --
# a runtime health check would have nothing to actually detect.
management.endpoint.health.group.readiness.include=readinessState,redis,db
# Mail is best-effort/non-critical everywhere in this app (EmailServiceImpl logs a warning and
# skips sending rather than failing a caller when unconfigured) -- the default mail health
# indicator doesn't reflect that: it synchronously opens a real SMTP connection on every /health
# call, so a misconfigured/rejected mail account (found via load testing, 2026-08-04: Gmail
# auth failing) makes every health check hang for seconds waiting on Gmail before failing. Since
# Tomcat threads are shared across all endpoints, that's enough to degrade the whole app under
# routine health-check polling (e.g. the Dockerfile's HEALTHCHECK, or any uptime monitor).
management.health.mail.enabled=false

# ── Error tracking (SYSTEM 13 TASK 13.1) ────────────────────────────────────────
# Empty DSN = SDK auto-disables itself (SentryOptions.isEnabled() checks this internally) -- local/
# dev/test are unaffected until a real DSN is set via SENTRY_DSN. Same disabled-by-default pattern
# as every other third-party credential in this app (Stripe/Razorpay/AWS Secrets Manager).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
# CRITICAL (task's own word): this app handles borrower PII (names, phone numbers, CKYC ids) --
# an unscrubbed error tracker is a data-processor problem and possibly a compliance breach.
# send-default-pii=false is already the SDK default; set explicitly so it can't be silently
# flipped by a future config change without the reviewer seeing exactly what they're turning on.
# max-request-body-size=none strips request bodies at the SDK level, defense-in-depth alongside
# SentryConfig's BeforeSendCallback (which also scrubs headers/cookies) -- two independent layers,
# not redundant: the SDK-level setting can't be bypassed by a bug in the callback, and the callback
# covers fields (headers, cookies, exception values) this property doesn't reach.
sentry.send-default-pii=false
sentry.max-request-body-size=none
# Error events: capture all by default (a storm still respects OpsAlertService-style judgement
# manually until real volume data justifies a lower rate) -- set SENTRY_SAMPLE_RATE below 1.0 if a
# real error storm ever threatens to become a billing event (task 13.1.d).
sentry.sample-rate=${SENTRY_SAMPLE_RATE:1.0}
# Performance tracing (distinct product from error tracking, its own separate billing dimension)
# is deliberately off by default -- TASK 13.1 asks for error tracking, not APM; enable explicitly
# via SENTRY_TRACES_SAMPLE_RATE if that's ever wanted.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.attach-stacktrace=true
sentry.in-app-includes=com.recoverpro
# Pulls these three MDC keys (RequestLoggingFilter/RlsContextFilter) onto every event as a
# searchable Sentry tag automatically (io.sentry.spring.jakarta.ContextTagsEventProcessor, part of
# the starter, auto-registered whenever MDC is on the classpath) -- satisfies TASK 13.1.b's
# "attach request id, org id, user id to every event" without needing custom capture code for the
# context-attachment half of that requirement.
sentry.context-tags=requestId,orgId,userId
# sentry.use-git-commit-id-as-release defaults to true and needs no config here -- confirmed by
# decompiling SentryAutoConfiguration$HubConfiguration: it reads the GitProperties bean already
# auto-configured from git.properties (SYSTEM 06 TASK 6.4.c's git-commit-id-maven-plugin output)
# and sets it as sentry.release automatically, satisfying TASK 13.1.b's release/git-SHA requirement.

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
application.file.allowed-types=${FILE_ALLOWED_TYPES:text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
application.file.max-size-bytes=${FILE_MAX_SIZE_BYTES:20971520}

# ── Local-disk storage (used when AWS_S3_ENABLED=false) ────────────────────────
# UPLOAD_DIR is the one directory a deployment actually needs to set -- every path
# below defaults to a subdirectory of it. Previously UPLOAD_DIR did nothing (each
# service had its own independent ./uploads/... relative default, unset by any env
# var), and app.storage.base-path was reused by both DocumentServiceImpl (collection
# receipts) and RagDocumentServiceImpl (RAG source docs) with different hardcoded
# defaults but the same property key -- setting it would have silently merged both
# services onto the same directory. Each service now has its own property.
app.storage.base-path=${UPLOAD_DIR:./uploads}/collections
app.storage.rag-documents-path=${UPLOAD_DIR:./uploads}/rag-documents
app.storage.sos-audio-path=${UPLOAD_DIR:./uploads}/sos-audio
app.storage.visits-path=${UPLOAD_DIR:./uploads}/visits
app.storage.call-recordings-path=${UPLOAD_DIR:./uploads}/call-recordings
app.storage.kfs-path=${UPLOAD_DIR:./uploads}/kfs
app.storage.reports-path=${REPORTS_DIR:./reports}

# ── Lucien AI ─────────────────────────────────────────────────────────────────
lucien.llama.base-url=${LLAMA_BASE_URL:http://localhost:11434}
lucien.llama.model=${LLAMA_MODEL:llama3}
lucien.llama.embedding-model=${LLAMA_EMBEDDING_MODEL:nomic-embed-text}
lucien.llama.max-tokens=${LLAMA_MAX_TOKENS:1024}
lucien.llama.temperature=${LLAMA_TEMPERATURE:0.7}
lucien.llama.top-p=${LLAMA_TOP_P:0.9}
lucien.llama.connect-timeout-ms=${LLAMA_CONNECT_TIMEOUT_MS:5000}
lucien.llama.read-timeout-ms=${LLAMA_READ_TIMEOUT_MS:300000}
lucien.agent.max-iterations=${LUCIEN_AGENT_MAX_ITERATIONS:8}
lucien.rate-limit.max-requests=${LUCIEN_RATE_LIMIT_MAX:20}
lucien.rate-limit.window-seconds=${LUCIEN_RATE_LIMIT_WINDOW:60}

# Local voice microservice (tts-service/ — FastAPI, wraps ai4bharat/IndicF5 for TTS and
# faster-whisper for STT). Shared base URL for both TtsClient and SttClient; same process.
#
# TTS (/tts, IndicF5): measured at ~8-9 minutes per reply in isolation on this CPU-only
# dev machine (no GPU), and prone to exceeding 15+ minutes if a second reply overlaps it —
# not viable for real usage. Not currently called from the frontend (LucienPanel always
# uses the browser voice); left wired here for whenever a fast-enough synthesis path
# (GPU / hosted API) exists.
#
# STT (/stt, faster-whisper): transcribing a short dictation clip is a much lighter job
# than TTS and runs in a few seconds on CPU, so this one IS called from the frontend —
# it's what backs the composer's mic button.
lucien.tts.base-url=${TTS_BASE_URL:http://localhost:8100}
lucien.tts.connect-timeout-ms=${TTS_CONNECT_TIMEOUT_MS:5000}
lucien.tts.read-timeout-ms=${TTS_READ_TIMEOUT_MS:60000}
resilience4j.circuitbreaker.instances.tts.sliding-window-size=10
resilience4j.circuitbreaker.instances.tts.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.tts.slow-call-duration-threshold=55000
resilience4j.circuitbreaker.instances.tts.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.tts.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tts.wait-duration-in-open-state=30000

# Circuit breaker for SttClient (tts-service's /stt endpoint, faster-whisper). Unlike
# IndicF5 TTS, transcribing a short dictation clip on CPU normally takes a few seconds —
# a much tighter slow-call threshold than the tts breaker's is appropriate here.
resilience4j.circuitbreaker.instances.stt.sliding-window-size=10
resilience4j.circuitbreaker.instances.stt.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.stt.slow-call-duration-threshold=15000
resilience4j.circuitbreaker.instances.stt.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.stt.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stt.wait-duration-in-open-state=30000

# Circuit breaker for the "llama" client (LlamaClient.chat/embed). Resilience4j's default
# slow-call-duration-threshold is 60s, but a CPU-only 8B model routinely takes 100-250s per
# reply — with the default, nearly every successful reply was recorded as a "slow call" and
# the breaker tripped open on its own, even though Ollama was healthy. Keep this just under
# lucien.llama.read-timeout-ms so only calls near the real timeout count as slow.
resilience4j.circuitbreaker.instances.llama.sliding-window-size=20
resilience4j.circuitbreaker.instances.llama.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.llama.slow-call-duration-threshold=280000
resilience4j.circuitbreaker.instances.llama.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.llama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llama.wait-duration-in-open-state=30000
clamav.enabled=${CLAMAV_ENABLED:false}
clamav.host=${CLAMAV_HOST:localhost}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:10000}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.recoverpro=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
